<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="contact.css">
    <title>Contacto</title>
</head>
<body>
<main>
    <header class="header">
     <div class="logo">
    <a href="App.html">
      <img src="/resources/piston.png" alt="Amstrack Motors" class="logo-img">
    </a>
  </div>
    <!-- botón hamburguesa -->
    <button class="burger" id="burgerBtn" aria-expanded="false" aria-controls="mainNav" aria-label="Abrir menú">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" aria-hidden="true" focusable="false">
        <path d="M4 7h16M4 12h16M4 17h16"
          stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
    </button>
    <!-- menú principal -->
    <nav class="nav" id="mainNav">
      <a href="index.html">Inicio</a>
      <a href="nosotros.html">Historia</a>
      <a href="contacto.html">Contacto</a>
    </nav>
  </header>

  
<section id="contacto" class="contact-section">
  <div class="contact-card">
    <h2 class="contact-title">Contáctanos</h2>
    <p class="contact-desc">¿Tienes dudas o quieres trabajar con nosotros? Escríbenos y te respondemos lo antes posible.</p>

    <form id="contactForm" class="contact-form" novalidate>
      <!-- Honeypot anti-spam (oculto) -->
      <input type="text" name="website" class="honeypot" autocomplete="off" tabindex="-1">

      <div class="row">
        <label for="name">Nombre</label>
        <input id="name" name="name" type="text" required placeholder="Tu nombre completo" />
      </div>

      <div class="row">
        <label for="email">Correo</label>
        <input id="email" name="email" type="email" required placeholder="tu@correo.com" />
      </div>

      <div class="row">
        <label for="subject">Asunto</label>
        <input id="subject" name="subject" type="text" placeholder="Asunto (opcional)" />
      </div>

      <div class="row">
        <label for="message">Mensaje</label>
        <textarea id="message" name="message" rows="6" required placeholder="Escribe tu mensaje..."></textarea>
      </div>

      <div class="row row-inline">
        <button type="submit" class="btn-submit">Enviar mensaje</button>
        <button type="button" id="contact-reset" class="btn-reset">Limpiar</button>
      </div>

      <p id="formStatus" class="form-status" role="status" aria-live="polite"></p>
    </form>

    <div class="contact-info">
      <div><strong>Email:</strong> <a href="mailto:info@tudominio.com">info@tudominio.com</a></div>
      <div><strong>Teléfono:</strong> <a href="tel:+51123456789">+51 123 456 789</a></div>
      <div><strong>Dirección:</strong> Lima, Perú</div>
    </div>
  </div>
</section>
  <footer>
  <div class="footer-content">
    <p>&copy; 2024 Amstrack Motors. Todos los derechos reservados.</p>
    <div class="social-media">
      <a href="#"><img src="resources/facebook.svg" alt="Facebook"></a>
      <a href="#"><img src="resources/tiktok.svg" alt="Tiktok"></a>
      <a href="#"><img src="resources/instagram.svg" alt="Instagram"></a>
    </div>
  </div>
</footer>
</main>
<script src="nuevo.js"></script>

  <img src="/resources/whatsapp.svg" alt="WhatsApp">
  </a>
</body>
</html>
